[project]
name = "ai_human_text_classification"
version = "0.1.0"
description = "Classification of the text generated by AI, using machine learning"
authors = [
    {name = "Savchuk Vitaliy"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "lightning (>=2.6.0,<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "dvc-gdrive (>=3.0.1,<4.0.0)",
    "dvc (>=3.65.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
