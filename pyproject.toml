[project]
name = "ai_human_text_classification"
version = "0.1.0"
description = "Classification of the text generated by AI, using machine learning"
authors = [
    {name = "Savchuk Vitaliy"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "lightning (>=2.6.0,<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "dvc-gdrive (>=3.0.1,<4.0.0)",
    "dvc (>=3.65.0,<4.0.0)",
    "mlflow (>=3.8.1,<4.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.5.1,<5.0.0)",
    "ruff (>=0.14.10,<0.15.0)",
    "fire (>=0.7.1,<0.8.0)"
]

[tool.ruff]
line-length = 100 # 90-99
format = { docstring-code-format = true }

[tool.ruff.init]
select = [
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
