name: ML Project CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry lock
          poetry install --with dev --no-root

      - name: Run Ruff Linter
        run: poetry run ruff check .

      - name: Run Ruff Format Check
        run: poetry run ruff format --check .

  build-docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ai-text-classifier:latest .
        
      - name: Test Docker image (Dry run)
        run: docker run --rm ai-text-classifier:latest python -c "import pandas; import lightning; print('Dependencies OK')"