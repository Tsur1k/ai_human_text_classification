training:
  batch_size: 32
  num_workers: 4
  test_size: 0.2
  val_size: 0.1
  random_seed: 42
  max_epochs: 50
  learning_rate: 0.001
  patience: 5
  max_size_tokens: 10000

model:
  embedding_dim: 128
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5
  bidirectional: true
  use_pretrained_embeddings: false